name: Unit Tests

on:
  pull_request:
    paths:
      - '.github/*.yml'
      - '.github/workflows/*.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'docs/*.md'
      - '*.slnx'
      - 'src/**'
      - 'tests/**'
  push:
    branches: [ main, master ]
    paths:
      - '.github/*.yml'
      - '.github/workflows/*.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'docs/*.md'
      - '*.slnx'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit-tests:
    name: windows-latest unit tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Validate policy XML
        shell: pwsh
        run: |
          [xml](Get-Content -Raw ADMX/FIM.ADMX) | Out-Null
          [xml](Get-Content -Raw ADMX/en-US/FIM.ADML) | Out-Null

      - name: Publish supported mode
        run: >-
          dotnet publish src/WinFIMLog/WinFIMLog.csproj --configuration Release
          --runtime win-x64 --self-contained true /p:PublishSingleFile=true
          /p:PublishReadyToRun=true /p:PublishTrimmed=false /p:PublishAot=false
          --output artifacts/win-x64

      - name: Verify executable
        shell: pwsh
        run: if (-not (Test-Path artifacts/win-x64/WinFIMLog.exe)) { throw 'Published executable is missing.' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-latest
          path: TestResults/**/*.trx
          if-no-files-found: ignore