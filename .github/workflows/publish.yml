name: Publish IntegrityService release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      BINARY_OUTPUT: ${{ github.workspace }}\artifacts\binaries
      PUBLISH_OUTPUT: ${{ runner.temp }}\IntegrityService-win-x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - id: version
        name: Read package version from Directory.Build.props
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props'
          $versions = @($props.Project.PropertyGroup.Version | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | ForEach-Object { $_.Trim() })
          if ($versions.Count -ne 1) {
            throw 'Directory.Build.props must contain exactly one non-empty Version element.'
          }

          $packageVersion = $versions[0]
          if ($packageVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw "Version '$packageVersion' in Directory.Build.props is not a supported SemVer package version."
          }

          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "tag=v$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Create release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag '$env:RELEASE_TAG' already exists; update Directory.Build.props to an unpublished version."
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate $env:RELEASE_TAG --message "Release $env:RELEASE_TAG"
          git push origin $env:RELEASE_TAG

      - name: Restore dependencies
        run: msbuild IntegrityService.sln /t:Restore /p:Configuration=Release

      - name: Build solution
        run: msbuild IntegrityService.sln /p:Configuration=Release /p:RestorePackages=false

      - name: Publish single-file service binary
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild IntegrityService/IntegrityService.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:PublishDir="$env:PUBLISH_OUTPUT\" `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:EnableCompressionInSingleFile=true `
            /p:PackageVersion=$env:PACKAGE_VERSION

          $binary = Join-Path $env:PUBLISH_OUTPUT 'IntegrityService.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected '$binary' to be produced by the publish target."
          }

      - name: Package release asset
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:BINARY_OUTPUT -Force | Out-Null
          $asset = Join-Path $env:BINARY_OUTPUT "IntegrityService-$env:PACKAGE_VERSION-win-x64.zip"
          Compress-Archive -Path (Join-Path $env:PUBLISH_OUTPUT '*') -DestinationPath $asset -Force
          Get-ChildItem -LiteralPath $env:BINARY_OUTPUT | Format-Table Name, Length

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $env:BINARY_OUTPUT "IntegrityService-$env:PACKAGE_VERSION-win-x64.zip"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw "No release asset found at '$asset'."
          }

          gh release create $env:RELEASE_TAG `
            --title "IntegrityService $env:PACKAGE_VERSION" `
            --notes "Published IntegrityService $env:PACKAGE_VERSION. The attached win-x64 asset contains the self-installing service executable." `
            $asset
